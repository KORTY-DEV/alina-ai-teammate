[mod-setting-description]
alina-sensor-radius=Радиус сканируется только по событию команды, а не каждый тик.
alina-resource-scan-limit=Жёсткий предел объектов одного запроса для защиты UPS.
alina-player-active-seconds=Пока игрок работает в зоне, автономные задачи туда не вмешиваются.
alina-auto-spawn=Создаёт отдельного персонажа рядом с первым подключившимся игроком.
alina-autonomy-enabled=Когда Алина свободна, она редко оценивает фабрику и выбирает одну безопасную полезную задачу.
alina-autonomy-interval-seconds=Минимальный интервал между компактными снимками для автономного планирования; на каждом тике LLM не вызывается.
alina-bridge-udp-port=Порт localhost, куда Factorio отправляет компактные события для локального AI bridge. По умолчанию 34198.
alina-world-model-radius=Начальный радиус порционного индексирования уже открытой фабрики. Дальние известные районы сохраняются в модели.
alina-display-name=Имя в окне, на карте и над персонажем. По умолчанию Алина.
alina-address-aliases=Дополнительные обращения, которые удаляются из начала команды. Например: Алина, Аля, Алечка.
alina-praise-frequency=off — выключено; rare — очень редко; normal — немного чаще. Похвалы событийные и не вызывают LLM.
alina-periodic-advice-enabled=Раз в 40–90 игровых минут Алина использует уже собранную модель мира и статистику производства, чтобы дать один короткий совет. Полного сканирования и вызова LLM нет.
alina-ui-verbosity=compact — только цель и текущая фаза; normal — также карта и режим связи; debug — дополнительные внутренние счётчики.

