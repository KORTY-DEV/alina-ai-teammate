[mod-setting-name]
alina-sensor-radius=Alina event sensor radius
alina-resource-scan-limit=Entities per sensor scan
alina-player-active-seconds=Player work-area protection, seconds
alina-auto-spawn=Automatically create Alina's character
alina-autonomy-enabled=Alina autonomous work
alina-autonomy-interval-seconds=Autonomous evaluation interval, seconds
alina-bridge-udp-port=Local Alina Bridge UDP port
alina-world-model-radius=Alina known-world radius
alina-display-name=Teammate display name
alina-address-aliases=Comma-separated address aliases
alina-praise-frequency=Rare player praise
alina-periodic-advice-enabled=Rare factory development advice
alina-ui-verbosity=Alina window detail

[mod-setting-description]
alina-sensor-radius=Scanned only for command events, never every tick.
alina-resource-scan-limit=Hard per-request object limit protecting UPS.
alina-player-active-seconds=Autonomous work yields while a player is active in the area.
alina-auto-spawn=Creates Alina as a separate character near the first connected player.
alina-autonomy-enabled=When free, Alina periodically evaluates the factory and selects one safe useful task.
alina-autonomy-interval-seconds=Minimum interval between bounded autonomous snapshots; the LLM is never called every tick.
alina-bridge-udp-port=Localhost port used for compact events sent to the optional local AI bridge. Default: 34198.
alina-world-model-radius=Initial radius for incremental indexing of the explored factory. Previously known remote districts remain cached.
alina-display-name=Name used in the window, map tag and character label. Default: Алина.
alina-address-aliases=Additional names recognized at the start of a command, for example: Алина, Аля, Алечка.
alina-praise-frequency=off disables praise; rare is the default; normal is slightly more frequent. Praise is deterministic and never invokes the LLM.
alina-periodic-advice-enabled=Every 40–90 game minutes Alina may produce one short hint from cached factory data. No full scan or LLM call is made.
alina-ui-verbosity=compact shows the goal and phase; normal also shows map and transport state; debug adds internal counters.

[string-mod-setting]
alina-praise-frequency-off=Off
alina-praise-frequency-rare=Rare
alina-praise-frequency-normal=Occasional
alina-ui-verbosity-compact=Compact
alina-ui-verbosity-normal=Normal
alina-ui-verbosity-debug=Debug

